<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diet Factory — Cited dietary guidance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3fbf7;
      --surface: #ffffff;
      --border: #cde8dc;
      --text: #12332a;
      --muted: #4b7166;
      --accent: #0f8a6a;
      --accent-hover: #0b7056;
      --warn-bg: #fff7ed;
      --warn-border: #fdba74;
      --scope-bg: #fef2f2;
      --scope-border: #fca5a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Manrope, "Segoe UI", sans-serif;
      background:
        radial-gradient(820px 380px at 110% -8%, rgba(231, 111, 81, 0.18), transparent 55%),
        radial-gradient(720px 360px at -8% 0%, rgba(15, 138, 106, 0.18), transparent 52%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 860px;
      margin: 1.4rem auto;
      padding: 0 1rem 3rem;
    }
    header.hero {
      background: linear-gradient(135deg, #064e3b 0%, #0f8a6a 58%, #14b8a6 100%);
      color: #f0fdf8;
      border-radius: 28px;
      padding: 1.5rem 1.55rem 1.3rem;
      margin-bottom: 1rem;
      box-shadow: 0 18px 40px rgba(6, 78, 59, 0.22);
    }
    .kicker {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 800;
      color: #bbf7d0;
      margin: 0 0 0.4rem;
    }
    header.hero h1 {
      font-family: Outfit, Manrope, sans-serif;
      font-size: 2.5rem;
      line-height: 1;
      margin: 0 0 0.5rem;
      color: #ffffff;
    }
    header.hero p {
      margin: 0;
      color: #d1fae5;
      font-size: 1.04rem;
      max-width: 40rem;
    }
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.95rem;
    }
    .pill {
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.12);
      color: #ecfdf5;
      border-radius: 999px;
      padding: 0.22rem 0.7rem;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .examples {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.55rem;
      margin-bottom: 0.9rem;
    }
    .example-btn {
      text-align: left;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.55rem 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .example-btn:hover { border-color: var(--accent); background: #f7fffb; }
    .ask-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 1.1rem 1.2rem;
      box-shadow: 0 8px 24px rgba(60, 40, 20, 0.05);
    }
    .form-row { display: flex; flex-direction: column; gap: 0.75rem; }
    label { font-weight: 600; font-size: 0.95rem; }
    textarea, select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f7fffb;
      font-size: 0.96rem;
      font-family: inherit;
    }
    textarea { min-height: 76px; resize: vertical; }
    .controls { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .controls select { flex: 1; min-width: 240px; }
    button.primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 0.6rem 1.25rem;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #turns { margin-top: 1.35rem; display: flex; flex-direction: column; gap: 1.15rem; }
    .turn { padding: 0.3rem 0; }
    .turn-question {
      font-family: Outfit, Manrope, sans-serif;
      font-size: 1.25rem;
      margin: 0.15rem 0 0.45rem;
    }
    .filter-badge {
      display: inline-block;
      padding: 0.12rem 0.55rem;
      font-size: 0.78rem;
      border-radius: 999px;
      background: #d1fae5;
      color: #065f46;
      font-weight: 700;
    }
    .section-block {
      border: 1px solid #cde8dc;
      border-left: 7px solid var(--accent);
      border-radius: 18px;
      padding: 0.95rem 1rem;
      margin-top: 0.7rem;
      background: var(--surface);
    }
    .section-header {
      font-family: Outfit, Manrope, sans-serif;
      font-weight: 700;
      font-size: 1.12rem;
    }
    .section-link {
      display: inline-block;
      font-size: 0.9rem;
      color: #0f8a6a;
      font-weight: 600;
      word-break: break-all;
      margin: 0.2rem 0 0.55rem;
    }
    .claims-list { margin: 0; padding-left: 1.25rem; }
    .claims-list li { margin-bottom: 0.45rem; }
    .section-heading-tag { color: var(--muted); font-size: 0.9rem; font-style: italic; }
    .refusal-corpus {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      padding: 0.95rem 1rem;
      border-radius: 18px;
    }
    .refusal-scope {
      background: var(--scope-bg);
      border: 1px solid var(--scope-border);
      padding: 0.95rem 1rem;
      border-radius: 18px;
    }
    .searched-box { margin-top: 0.75rem; font-size: 0.92rem; }
    .searched-box ul { margin: 0.35rem 0 0; padding-left: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <p class="kicker">Cited diet and food-safety guidance</p>
      <h1>Diet Factory</h1>
      <p>Ask how to eat and how to keep food safe. Answers come only from seven public guidance documents, and every claim keeps its own source.</p>
      <div class="pills">
        <span class="pill">Cited sections</span>
        <span class="pill">No blended guidelines</span>
        <span class="pill">Medical &amp; weight questions declined</span>
      </div>
    </header>

    <div class="examples">
      <button type="button" class="example-btn" data-q="What does a healthy diet include?">What does a healthy diet include?</button>
      <button type="button" class="example-btn" data-q="How does the Eatwell Guide divide food groups?">How does the Eatwell Guide divide food groups?</button>
      <button type="button" class="example-btn" data-q="What temperature should my fridge be?">What temperature should my fridge be?</button>
      <button type="button" class="example-btn" data-q="Which oil should I use, and is it safe to reuse?">Which oil should I use, and is it safe to reuse?</button>
    </div>

    <form id="ask-form" class="ask-card">
      <div class="form-row">
        <div>
          <label for="question-input">What do you want to check?</label>
          <textarea
            id="question-input"
            name="question"
            placeholder="What does a healthy diet include?"
            required
          ></textarea>
        </div>
        <div class="controls">
          <select id="filter-input" name="document_filter" aria-label="Optional document filter">
            <option value="">Search all seven documents</option>
            <option value="who-healthy-diet">WHO Healthy diet, Fact sheet N°394 — World Health Organization</option>
            <option value="fao-who-healthy-diets">What are healthy diets? — FAO and WHO</option>
            <option value="eatwell-guide">The Eatwell Guide — UK Government (Public Health England)</option>
            <option value="cold-food-storage">Cold Food Storage Chart — USDA Food Safety and Inspection Service</option>
            <option value="fsa-chill">How to chill, freeze and defrost food safely — UK Food Standards Agency</option>
            <option value="who-five-keys">Five Keys to Safer Food — World Health Organization</option>
            <option value="kitchen-companion">Kitchen Companion — USDA Food Safety and Inspection Service</option>
          </select>
          <button type="submit" id="submit-btn" class="primary">Ask Diet Factory</button>
        </div>
      </div>
    </form>

    <div id="turns"></div>
  </main>

  <script>
    const form = document.getElementById("ask-form");
    const questionInput = document.getElementById("question-input");
    const filterInput = document.getElementById("filter-input");
    const submitBtn = document.getElementById("submit-btn");
    const turnsContainer = document.getElementById("turns");

    function renderTurn(question, filterVal, data) {
      const turnEl = document.createElement("div");
      turnEl.className = "turn";

      if (filterVal) {
        const badge = document.createElement("div");
        badge.className = "filter-badge";
        badge.textContent = `Filtered to ${filterVal}`;
        turnEl.appendChild(badge);
      }

      const qEl = document.createElement("div");
      qEl.className = "turn-question";
      qEl.textContent = question;
      turnEl.appendChild(qEl);

      if (data.outcome === "grounded_answer") {
        (data.sections || []).forEach((sec) => {
          const secEl = document.createElement("div");
          secEl.className = "section-block";

          const headerEl = document.createElement("div");
          headerEl.className = "section-header";
          headerEl.textContent = `${sec.document_name} — ${sec.publisher}, ${sec.year}`;
          secEl.appendChild(headerEl);

          const linkEl = document.createElement("a");
          linkEl.className = "section-link";
          linkEl.href = sec.source_url;
          linkEl.target = "_blank";
          linkEl.rel = "noopener noreferrer";
          linkEl.textContent = sec.source_url;
          secEl.appendChild(linkEl);

          const ul = document.createElement("ul");
          ul.className = "claims-list";
          (sec.claims || []).forEach((claim) => {
            const li = document.createElement("li");
            const claimText = document.createElement("span");
            claimText.textContent = claim.text + " ";
            li.appendChild(claimText);

            if (claim.section_heading) {
              const headingSpan = document.createElement("span");
              headingSpan.className = "section-heading-tag";
              headingSpan.textContent = `(${claim.section_heading})`;
              li.appendChild(headingSpan);
            }
            ul.appendChild(li);
          });
          secEl.appendChild(ul);
          turnEl.appendChild(secEl);
        });
      } else if (data.outcome === "not_in_corpus") {
        const box = document.createElement("div");
        box.className = "refusal-corpus";

        const msg = document.createElement("div");
        msg.textContent = data.message || "The guidance does not cover this question.";
        box.appendChild(msg);

        if (Array.isArray(data.searched) && data.searched.length > 0) {
          const searchedBox = document.createElement("div");
          searchedBox.className = "searched-box";
          const label = document.createElement("strong");
          label.textContent = "Documents searched:";
          searchedBox.appendChild(label);

          const ul = document.createElement("ul");
          data.searched.forEach((doc) => {
            const li = document.createElement("li");
            li.textContent = `${doc.document_name} (${doc.publisher})`;
            ul.appendChild(li);
          });
          searchedBox.appendChild(ul);
          box.appendChild(searchedBox);
        }
        turnEl.appendChild(box);
      } else if (data.outcome === "out_of_scope") {
        const box = document.createElement("div");
        box.className = "refusal-scope";
        box.textContent = data.message || "This request is out of scope.";
        turnEl.appendChild(box);
      }

      turnsContainer.prepend(turnEl);
    }

    async function sendQuestion(question, filterVal) {
      const payload = { question: question, document_filter: filterVal };
      submitBtn.disabled = true;
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) {
          renderTurn(question, filterVal, {
            outcome: "out_of_scope",
            message: data.detail || `Error ${response.status}`,
          });
        } else {
          renderTurn(question, filterVal, data);
        }
      } catch (err) {
        renderTurn(question, filterVal, {
          outcome: "out_of_scope",
          message: `Request failed: ${err.message}`,
        });
      } finally {
        submitBtn.disabled = false;
      }
    }

    document.querySelectorAll(".example-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        sendQuestion(btn.dataset.q, filterInput.value.trim() || null);
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;
      const filterVal = filterInput.value.trim() || null;
      questionInput.value = "";
      await sendQuestion(question, filterVal);
    });
  </script>
</body>
</html>
